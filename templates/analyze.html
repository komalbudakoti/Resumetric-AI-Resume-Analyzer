<head>
    <title>Resume Analyser - Resumetric AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    {% include 'sidebar.html' %}
    <div class="main-content">
        <div class="card">
            <div class="section-head">
                <span class="eyebrow">Optimizer</span>
                <h2>Resumetric AI Analyser</h2>
                <p class="lead">Upload your professional documents to receive a deep-dive analysis of your ATS compatibility and skill alignment.</p>
            </div>

            <form action="/upload" method="post" enctype="multipart/form-data" style="margin-top: 30px;">
                <label>Upload Resume (PDF/DOCX)</label>
                <div class="input-file-wrapper">
                    <input type="file" name="resume" accept=".pdf,.docx" required>
                </div>

                <label>Job Description</label>
                <textarea name="job_description" rows="8" placeholder="Paste JD here..." required></textarea>

            <div class="action-container" style="text-align: center; margin-top: 11px;">
    <button id="analyzeBtn" type="submit" class="cta-btn">
        Start AI Analysis
    </button>
    <p style="margin-top: 14px; font-size: 0.85rem; color: var(--muted-color); font-weight: 500;">
        Powered by Resumetric Intelligence Engine
    </p>
</div>
            </form>
        </div>
    </div>
    <script>

        document.querySelector('form').onsubmit = function () {

            const btn = document.getElementById('analyzeBtn');

            btn.innerHTML = "AI is Analyzing... Please Wait...";
            btn.style.opacity = "0.7";
            btn.disabled = true;
        };

    </script>
</body>
</html>
